name: Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version without the qemu-qmx-v prefix
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build once, package, and publish
    runs-on: ubuntu-latest

    steps:
      - name: Validate release version before checkout
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          test -n "$VERSION"
          repo_version="$(
            gh api \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "repos/${GITHUB_REPOSITORY}/contents/QMX_VERSION?ref=${GITHUB_SHA}" \
              --jq '.content' \
            | tr -d '\n' \
            | base64 --decode \
            | tr -d '\r\n'
          )"
          if [[ "$VERSION" != "$repo_version" ]]; then
            echo "Requested release version '$VERSION' does not match QMX_VERSION '$repo_version' at $GITHUB_SHA." >&2
            exit 1
          fi

      - name: Check out source once
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Prepare artifact directories
        shell: bash
        run: |
          rm -rf artifacts build-release stage-release
          mkdir -p artifacts/source artifacts/debian artifacts/rpm artifacts/arch

      - name: Install build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential binutils ccache make meson ninja-build pkg-config python3 \
            libfdt-dev libglib2.0-dev libpixman-1-dev libslirp-dev libsdl2-dev zlib1g-dev

      - name: Compute same-day cache key
        id: cache-key
        shell: bash
        run: echo "day=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Restore same-day compiler cache
        id: ccache-restore
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/ccache
          key: qemu-qmx-ccache-${{ runner.os }}-${{ steps.cache-key.outputs.day }}-${{ hashFiles('**/*.c', '**/*.h', '**/*.S', '**/*.s', '**/meson.build', 'configure', 'Makefile', 'roms/seabios/**') }}
          restore-keys: |
            qemu-qmx-ccache-${{ runner.os }}-${{ steps.cache-key.outputs.day }}-

      - name: Configure compiler cache
        shell: bash
        run: |
          mkdir -p "$HOME/.cache/ccache"
          echo "CCACHE_DIR=$HOME/.cache/ccache" >> "$GITHUB_ENV"
          echo "/usr/lib/ccache" >> "$GITHUB_PATH"
          ccache --max-size=2G
          ccache --zero-stats
          echo "Resolved compilers:"
          command -v cc
          command -v gcc
          echo "ccache configuration:"
          ccache --show-config
          echo "ccache statistics before build:"
          ccache --show-stats

      - name: Build full QEMU-QMX and SeaBIOS once
        shell: bash
        run: |
          make -C roms/seabios
          mkdir build-release
          cd build-release
          ../configure \
            --prefix=/usr \
            --libdir=/usr/lib \
            --enable-system \
            --enable-kvm \
            --enable-tcg \
            --enable-sdl \
            --enable-slirp \
            --enable-tools \
            --enable-guest-agent \
            --enable-fdt=system
          ninja
          cd ..
          cc -O2 -Wall -Wextra \
            tools/qmx-verify-gui.c \
            -o build-release/qmx-verify-gui \
            $(pkg-config --cflags --libs sdl2)
          echo "ccache statistics after build:"
          ccache --show-stats

      - name: Test the single full build
        shell: bash
        run: |
          python3 tests/qmx/test-qmx-parser.py build-release/qemu-system-x86_64
          python3 tests/qmx/test-qmx-integration.py build-release/qemu-system-x86_64
          required=(
            qemu-system-aarch64
            qemu-system-riscv64
            qemu-img
            qga/qemu-ga
          )
          for binary in "${required[@]}"; do
            if [[ ! -x "build-release/$binary" ]]; then
              echo "Required full-build binary missing: build-release/$binary" >&2
              find build-release -maxdepth 2 -type f -name 'qemu*' -printf '%p\n' | sort >&2
              exit 1
            fi
          done

      - name: Save same-day compiler cache
        if: steps.ccache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/ccache
          key: ${{ steps.ccache-restore.outputs.cache-primary-key }}

      - name: Build self-contained source archive
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          archive="$RUNNER_TEMP/qemu-qmx-${VERSION}-source.tar.gz"
          tar \
            --exclude-vcs \
            --exclude='./build*' \
            --exclude='./artifacts' \
            --exclude='./stage-release' \
            --transform="s,^\./,qemu-qmx-${VERSION}/," \
            -czf "$archive" .
          cp "$archive" "artifacts/source/qemu-qmx-${VERSION}-source.tar.gz"
          sha256sum "artifacts/source/qemu-qmx-${VERSION}-source.tar.gz" \
            > "artifacts/source/qemu-qmx-${VERSION}-source.tar.gz.sha256"

      - name: Stage canonical release payload
        shell: bash
        run: |
          DESTDIR="$GITHUB_WORKSPACE/stage-release" ninja -C build-release install
          install -Dm0755 build-release/qmx-verify-gui stage-release/usr/libexec/qemu-qmx/qmx-verify-gui
          install -Dm0644 roms/seabios/out/bios.bin stage-release/usr/share/qemu/bios.bin
          install -Dm0644 roms/seabios/out/bios.bin stage-release/usr/share/qemu/bios-256k.bin
          install -Dm0644 QMX_VERSION stage-release/usr/share/doc/qemu-qmx/QMX_VERSION
          install -Dm0644 docs/QMX_Format_Specification_v0.2.md stage-release/usr/share/doc/qemu-qmx/QMX_Format_Specification_v0.2.md
          install -Dm0644 docs/QMX_Minimum_Implementation_Requirements_v0.1.md stage-release/usr/share/doc/qemu-qmx/QMX_Minimum_Implementation_Requirements_v0.1.md
          install -Dm0644 "docs/releases/QMX_${{ inputs.version }}.md" "stage-release/usr/share/doc/qemu-qmx/QMX_${{ inputs.version }}.md"
          install -Dm0644 COPYING stage-release/usr/share/licenses/qemu-qmx/COPYING
          install -Dm0644 packaging/linux/qemu-qmx.desktop stage-release/usr/share/applications/qemu-qmx.desktop
          install -Dm0644 packaging/linux/qemu-qmx-verify.desktop stage-release/usr/share/applications/qemu-qmx-verify.desktop
          install -Dm0644 packaging/linux/qemu-qmx.xml stage-release/usr/share/mime/packages/qemu-qmx.xml
          install -Dm0644 packaging/linux/qemu-qmx-verify-kde.desktop stage-release/usr/share/kio/servicemenus/qemu-qmx-verify.desktop
          rm -rf stage-release/var/run
          test -x stage-release/usr/bin/qemu-system-x86_64
          test -x stage-release/usr/bin/qemu-system-i386
          test -x stage-release/usr/bin/qemu-system-aarch64
          test -x stage-release/usr/bin/qemu-system-riscv64
          test -x stage-release/usr/bin/qemu-img
          test -x stage-release/usr/bin/qemu-ga
          test -x stage-release/usr/libexec/qemu-qmx/qmx-verify-gui
          test -f stage-release/usr/share/qemu/bios.bin
          test -f stage-release/usr/share/qemu/bios-256k.bin
          test -f stage-release/usr/share/applications/qemu-qmx.desktop
          test -f stage-release/usr/share/applications/qemu-qmx-verify.desktop
          test -f stage-release/usr/share/mime/packages/qemu-qmx.xml
          test -f stage-release/usr/share/kio/servicemenus/qemu-qmx-verify.desktop

      - name: Package Debian / apt
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          docker run --rm \
            -e VERSION="$VERSION" \
            -v "$GITHUB_WORKSPACE/stage-release:/stage:ro" \
            -v "$GITHUB_WORKSPACE/artifacts/debian:/out" \
            debian:trixie \
            bash -euxo pipefail -c '
              apt-get update
              apt-get install -y dpkg-dev libc6 libglib2.0-0t64 libpixman-1-0 libslirp0 libsdl2-2.0-0 libsndio7.0 zlib1g
              mkdir -p /pkg/DEBIAN /tmp/debian
              cp -a /stage/. /pkg/
              printf "%s\n" \
                "Source: qemu-qmx" \
                "Section: otherosfs" \
                "Priority: optional" \
                "Maintainer: QEMU-QMX Project <noreply@github.com>" \
                "" \
                "Package: qemu-qmx" \
                "Architecture: amd64" \
                "Description: Complete QEMU build with QMX configuration support" \
                > /tmp/debian/control
              cd /tmp
              deps="$(dpkg-shlibdeps -O -e/pkg/usr/bin/qemu-system-x86_64 -e/pkg/usr/bin/qemu-system-i386 -e/pkg/usr/bin/qemu-img -e/pkg/usr/libexec/qemu-qmx/qmx-verify-gui | sed -n "s/^shlibs:Depends=//p")"
              qemu_packages="$(apt-cache pkgnames | grep -E "^qemu($|-)" | grep -v "^qemu-qmx$" | sort -u | paste -sd, - | sed "s/,/, /g")"
              printf "%s\n" \
                "Package: qemu-qmx" \
                "Version: 1:11.1.50+qmx0.9.0~beta1-1" \
                "Section: otherosfs" \
                "Priority: optional" \
                "Architecture: amd64" \
                "Maintainer: QEMU-QMX Project <noreply@github.com>" \
                "Depends: ${deps}" \
                "Provides: qemu-system-x86, qemu-system-common, qemu-system-data, qemu-utils, qemu-user, qemu-user-static, qemu-guest-agent, seabios" \
                "Conflicts: ${qemu_packages}, seabios" \
                "Breaks: ${qemu_packages}, seabios" \
                "Replaces: ${qemu_packages}, seabios" \
                "Description: Complete QEMU build with QMX configuration support" \
                " QEMU-QMX is a complete system replacement for the distribution QEMU packages." \
                " It installs the full QEMU build at the standard system paths and adds QMX" \
                " machine-configuration support to the x86 system emulators." \
                > /pkg/DEBIAN/control
              dpkg-deb --root-owner-group --build /pkg "/out/qemu-qmx_${VERSION}_amd64.deb"
              sha256sum /out/*.deb > /out/SHA256SUMS-debian
            '

      - name: Package Fedora / dnf
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          docker run --rm \
            -e VERSION="$VERSION" \
            -v "$GITHUB_WORKSPACE/stage-release:/stage:ro" \
            -v "$GITHUB_WORKSPACE/artifacts/rpm:/out" \
            fedora:latest \
            bash -euxo pipefail -c '
              dnf -y install rpm-build tar gzip dnf-plugins-core
              mkdir -p /rpmbuild/{BUILD,BUILDROOT,RPMS,SOURCES,SPECS,SRPMS}
              tar -C /stage -czf /rpmbuild/SOURCES/qemu-qmx-payload.tar.gz .
              find /stage \( -type f -o -type l \) -printf "/%P\n" > /rpmbuild/SOURCES/files.list
              qemu_packages="$(
                dnf repoquery --available --qf "%{name}\\n" "qemu*" 2>/dev/null \
                  | awk '\''/^qemu($|-)/ && $0 != "qemu-qmx"'\'' \
                  | sort -u
              )"
              if [[ -z "$qemu_packages" ]]; then
                echo "Fedora repository query returned no qemu-* packages; refusing to build incomplete replacement metadata." >&2
                dnf repoquery --available --qf "%{name}\\n" "qemu*" 2>&1 >&2 || true
                exit 1
              fi
              {
                printf "%s\n" \
                  "Name:           qemu-qmx" \
                  "Epoch:          2" \
                  "Version:        11.1.50" \
                  "Release:        0.9.0.beta1%{?dist}" \
                  "Summary:        Complete QEMU build with QMX machine configuration support" \
                  "License:        GPL-2.0-or-later" \
                  "Source0:        qemu-qmx-payload.tar.gz" \
                  "BuildArch:      x86_64"
                while IFS= read -r pkg; do
                  test -n "$pkg" || continue
                  printf "Provides:       %s\n" "$pkg"
                  printf "Conflicts:      %s\n" "$pkg"
                  printf "Obsoletes:      %s\n" "$pkg"
                done <<< "$qemu_packages"
                printf "%s\n" \
                  "Provides:       seabios-bin" \
                  "Conflicts:      seabios-bin" \
                  "Obsoletes:      seabios-bin" \
                  "" \
                  "%description" \
                  "QEMU-QMX is a complete system replacement for the distribution QEMU packages." \
                  "It installs the full QEMU build at the standard system paths and adds QMX" \
                  "machine-configuration support to the x86 system emulators." \
                  "" \
                  "%prep" \
                  "mkdir payload" \
                  "tar -xzf %{SOURCE0} -C payload" \
                  "" \
                  "%install" \
                  "mkdir -p %{buildroot}" \
                  "cp -a payload/. %{buildroot}/" \
                  "" \
                  "%files -f %{_sourcedir}/files.list"
              } > /rpmbuild/SPECS/qemu-qmx.spec
              rpmbuild -bb /rpmbuild/SPECS/qemu-qmx.spec --define "_topdir /rpmbuild"
              find /rpmbuild/RPMS -name "*.rpm" -exec cp -v {} /out/ \;
              sha256sum /out/*.rpm > /out/SHA256SUMS-rpm
            '

      - name: Package Arch / pacman
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          docker run --rm \
            -e VERSION="$VERSION" \
            -v "$GITHUB_WORKSPACE/stage-release:/stage:ro" \
            -v "$GITHUB_WORKSPACE/artifacts/arch:/out" \
            archlinux:base-devel \
            bash -euxo pipefail -c '
              pacman -Syu --noconfirm
              pacman -S --noconfirm --needed glib2 pixman zlib libslirp sdl2-compat
              useradd -m builder
              mkdir -p /build
              qemu_conflicts="$(pacman -Sl | awk "\$2 ~ /^qemu-/ {print \$2}" | sort -u | awk "{printf \"\\\"%s\\\" \", \$1}")"
              qemu_provides="$(pacman -Sl | awk "\$2 ~ /^qemu-/ {print \$2 \"=\" \$3}" | sort -u | awk "{printf \"\\\"%s\\\" \", \$1}")"
              printf "%s\n" \
                "pkgname=qemu-qmx" \
                "pkgver=11.1.50.qmx0.9.0beta1" \
                "pkgrel=1" \
                "pkgdesc=\"Complete QEMU build with QMX machine configuration support\"" \
                "arch=(\"x86_64\")" \
                "license=(\"GPL-2.0-or-later\")" \
                "depends=(\"dtc\" \"glib2\" \"pixman\" \"zlib\" \"libslirp\" \"sdl2-compat\")" \
                "provides=(${qemu_provides})" \
                "conflicts=(${qemu_conflicts} \"seabios\" \"edk2-aarch64\" \"edk2-riscv64\")" \
                "replaces=(${qemu_conflicts} \"seabios\" \"edk2-aarch64\" \"edk2-riscv64\")" \
                "" \
                "package() {" \
                "  cp -a /stage/. \"\$pkgdir/\"" \
                "}" \
                > /build/PKGBUILD
              chown -R builder:builder /build
              su builder -c "cd /build && makepkg --noconfirm"
              cp /build/qemu-qmx-*.pkg.tar.* /out/
              sha256sum /out/qemu-qmx-*.pkg.tar.* > /out/SHA256SUMS-arch
            '

      - name: Verify release payload
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          test -f "artifacts/source/qemu-qmx-${VERSION}-source.tar.gz"
          compgen -G 'artifacts/debian/qemu-qmx_*.deb' >/dev/null
          compgen -G 'artifacts/rpm/*.rpm' >/dev/null
          compgen -G 'artifacts/arch/qemu-qmx-*.pkg.tar.*' >/dev/null

      - name: Create consolidated SHA-256 checksums
        shell: bash
        run: |
          (
            cd artifacts
            sha256sum source/qemu-qmx-*-source.tar.gz debian/qemu-qmx_*.deb rpm/*.rpm arch/qemu-qmx-*.pkg.tar.*
          ) > artifacts/SHA256SUMS

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: qemu-qmx-${{ inputs.version }}
          path: artifacts/
          if-no-files-found: error

      - name: Publish beta release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          tag="qemu-qmx-v${VERSION}"
          gh release create "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            artifacts/source/* \
            artifacts/debian/* \
            artifacts/rpm/* \
            artifacts/arch/* \
            artifacts/SHA256SUMS \
            --notes-file "docs/releases/QMX_${VERSION}.md" \
            --prerelease \
            --title "QEMU-QMX ${VERSION} beta" \
            --target "$GITHUB_SHA"
