name: Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version without the qemu-qmx-v prefix
        required: true

permissions:
  contents: write

env:
  SEABIOS_COMMIT: e0b009af38836aa5d1d55713d470721835f03664

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest

    steps:
      - name: Check out source once
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Validate release version
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          test -n "$REQUESTED_VERSION"
          test "$REQUESTED_VERSION" = "$(cat QMX_VERSION)"

      - name: Prepare artifact directories
        shell: bash
        run: |
          rm -rf artifacts
          mkdir -p artifacts/source artifacts/debian artifacts/rpm artifacts/arch

      - name: Build self-contained source archive
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          archive="$RUNNER_TEMP/qemu-qmx-${VERSION}-source.tar.gz"
          tar \
            --exclude-vcs \
            --exclude='./build*' \
            --exclude='./artifacts' \
            --transform="s,^\./,qemu-qmx-${VERSION}/," \
            -czf "$archive" .
          cp "$archive" "artifacts/source/qemu-qmx-${VERSION}-source.tar.gz"
          sha256sum "artifacts/source/qemu-qmx-${VERSION}-source.tar.gz" \
            > "artifacts/source/qemu-qmx-${VERSION}-source.tar.gz.sha256"

      - name: Build Debian package
        shell: bash
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/source:ro" \
            -v "$GITHUB_WORKSPACE/artifacts/debian:/out" \
            ubuntu:latest \
            bash -euxo pipefail -c '
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              apt-get install -y \
                build-essential debhelper devscripts dpkg-dev ninja-build meson pkg-config \
                python3 python3-venv libglib2.0-dev libpixman-1-dev libslirp-dev \
                libsdl2-dev zlib1g-dev
              cp -a /source /work
              cd /work
              cp -a packaging/debian debian
              dpkg-buildpackage -b -us -uc
              cp /qemu-qmx_*.deb /out/
              sha256sum /out/*.deb > /out/SHA256SUMS-debian
            '

      - name: Build Fedora RPM
        shell: bash
        run: |
          docker run --rm \
            -e SEABIOS_COMMIT="$SEABIOS_COMMIT" \
            -v "$GITHUB_WORKSPACE:/source:ro" \
            -v "$GITHUB_WORKSPACE/artifacts/rpm:/out" \
            fedora:latest \
            bash -euxo pipefail -c '
              dnf -y install \
                rpm-build gcc binutils make glib2-devel libslirp-devel meson ninja-build \
                pixman-devel pkgconf-pkg-config python3 SDL2-devel zlib-devel tar gzip
              cp -a /source /work
              cd /work
              version="$(cat QMX_VERSION)"
              tag="qemu-qmx-v${version}"
              mkdir -p /rpmbuild/SOURCES
              tar \
                --exclude-vcs \
                --exclude="./build*" \
                --exclude="./artifacts" \
                --transform="s,^\./,qemu-qmx-${tag}/," \
                -czf "/rpmbuild/SOURCES/${tag}.tar.gz" .
              tar -C roms \
                --exclude-vcs \
                --transform="s,^seabios/,seabios-setupmenu-${SEABIOS_COMMIT}/," \
                -czf "/rpmbuild/SOURCES/${SEABIOS_COMMIT}.tar.gz" seabios
              rpmbuild -ba packaging/rpm/qemu-qmx.spec \
                --define "_topdir /rpmbuild" \
                --define "_sourcedir /rpmbuild/SOURCES"
              find /rpmbuild/RPMS -name "*.rpm" -exec cp -v {} /out/ \;
              sha256sum /out/*.rpm > /out/SHA256SUMS-rpm
            '

      - name: Build Arch package
        shell: bash
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/source:ro" \
            -v "$GITHUB_WORKSPACE/artifacts/arch:/out" \
            archlinux:base-devel \
            bash -euxo pipefail -c '
              pacman -Syu --noconfirm
              pacman -S --noconfirm --needed \
                git gcc binutils make meson ninja python pkgconf glib2 pixman zlib libslirp sdl2-compat
              useradd -m builder
              mkdir -p /build/src/qemu-qmx /build/src/seabios-qmx
              cp -a /source/. /build/src/qemu-qmx/
              rm -rf /build/src/qemu-qmx/roms/seabios
              cp -a /source/roms/seabios/. /build/src/seabios-qmx/
              cp /source/packaging/arch/PKGBUILD /build/PKGBUILD
              sed -i \
                -e '\''s|source=(|source=(\n  "qemu-qmx::file://src/qemu-qmx"\n  "seabios-qmx::file://src/seabios-qmx"|'\'' \
                -e '\''/git+https:\/\/github.com\/StochasticEagle\/qemu-qmx.git/d'\'' \
                -e '\''/git+https:\/\/github.com\/StochasticEagle\/seabios-setupmenu.git/d'\'' \
                /build/PKGBUILD
              chown -R builder:builder /build
              su builder -c "cd /build && makepkg --noconfirm --noextract"
              cp /build/qemu-qmx-*.pkg.tar.* /out/
              sha256sum /out/qemu-qmx-*.pkg.tar.* > /out/SHA256SUMS-arch
            '

      - name: Verify release payload
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          test -f "artifacts/source/qemu-qmx-${VERSION}-source.tar.gz"
          compgen -G 'artifacts/debian/qemu-qmx_*.deb' >/dev/null
          compgen -G 'artifacts/rpm/*.rpm' >/dev/null
          compgen -G 'artifacts/arch/qemu-qmx-*.pkg.tar.*' >/dev/null

      - name: Create consolidated SHA-256 checksums
        shell: bash
        run: |
          (
            cd artifacts
            sha256sum \
              source/qemu-qmx-*-source.tar.gz \
              debian/qemu-qmx_*.deb \
              rpm/*.rpm \
              arch/qemu-qmx-*.pkg.tar.*
          ) > artifacts/SHA256SUMS

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: qemu-qmx-${{ inputs.version }}
          path: artifacts/
          if-no-files-found: error

      - name: Publish beta release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          tag="qemu-qmx-v${VERSION}"
          gh release create "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            artifacts/source/* \
            artifacts/debian/* \
            artifacts/rpm/* \
            artifacts/arch/* \
            artifacts/SHA256SUMS \
            --notes-file "docs/releases/QMX_${VERSION}.md" \
            --prerelease \
            --title "QEMU-QMX ${VERSION} beta" \
            --target "$GITHUB_SHA"
